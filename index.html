<div class="app">
  <!-- ===== 桌面左侧边栏 ===== -->
  <aside class="sidebar">
    <div class="brandmark">
      <span class="logo"><svg width="18" height="18"><use href="#i-flag"/></svg></span>

    </div>
    <nav id="navDesk"></nav>
    <div class="side-foot">数据保存在线上资料库<br>换设备、换浏览器都在</div>
  </aside>

  <!-- ===== 平板顶部导航 ===== -->

    <div class="brandmark">
      <span class="logo"><svg width="16" height="16"><use href="#i-flag"/></svg></span>
      <span>学习目标管理台</span>
    </div>

  </header>

  <!-- ===== 主区域 ===== -->

      <div>

        <div class="sub" id="mSub">加载中…</div>
      </div>
      <div id="mHeadAct"></div>
    </div>
    <div id="deskHead"></div>
    <div id="view"></div>
  </main>
